<html>

<h2>記事登録フォーム（管理者用）</h2>

<label>記事タイトル：</label><br>
<input id="article-title" type="text"><br><br>

<label>記事URL：</label><br>
<input id="article-url" type="text"><br><br>

<button onclick="registerArticle()">登録する</button>

<p id="register-result" style="color:green;"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc 
  }from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyBvvLItcbG3ajY7FAvWy9bzocYSldiVUNk",
    authDomain: "toukou-form.firebaseapp.com",
    projectId: "toukou-form",
    storageBucket: "toukou-form.appspot.com",
    messagingSenderId: "549216615731",
    appId: "1:549216615731:web:fc471bec0aacf2f364d246"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function registerArticle() {
    const title = document.getElementById("article-title").value;
    const url = document.getElementById("article-url").value;

    if (!title || !url) {
      document.getElementById("register-result").innerText = "タイトルとURLを入力してね";
      return;
    }

    await addDoc(collection(db, "articles"), {
      title: title,
      url: url,
      createdAt: Date.now()
    });

    await trimArticles();

    document.getElementById("register-result").innerText = "登録完了！";
  }

  async function trimArticles() {
    const articlesRef = collection(db, "articles");
    const q = query(articlesRef, orderBy("createdAt", "asc"));
    const snapshot = await getDocs(q);

    if (snapshot.size > 5) {
      const extra = snapshot.size - 5;
      let count = 0;

      snapshot.forEach(doc => {
        if (count < extra) {
          deleteDoc(doc.ref);
          count++;
        }
      });
    }
  }
</script>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("key") !== "seiru-only") {
    document.body.innerHTML = "このページは存在しません";
  }
</script>

</html>
