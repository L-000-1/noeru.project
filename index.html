<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBvvLItcbG3ajY7FAvWy9bzocYSldiVUNk",
    authDomain: "toukou-form.firebaseapp.com",
    projectId: "toukou-form",
    storageBucket: "toukou-form.appspot.com",
    messagingSenderId: "549216615731",
    appId: "1:549216615731:web:fc471bec0aacf2f364d246"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadLatestArticles() {
    const q = query(
      collection(db, "articles"),
      orderBy("createdAt", "desc"),
      limit(5)
    );

    const snapshot = await getDocs(q);
    const list = document.getElementById("latest-articles");

    list.innerHTML = ""; // 初期化

    snapshot.forEach(doc => {
      const data = doc.data();

      const dateText = data.createdAt
        ? data.createdAt.toDate().toLocaleString()
        : "";

      const item = document.createElement("li");
      item.innerHTML = `
        <a href="${data.url}" target="_blank">${data.title}</a><br>
        <small>${dateText}</small>
      `;
      list.appendChild(item);
    });
  }

  loadLatestArticles();
</script>
